heading: am design practice is the studio of architectural designer Angeliki Mathiopoulou.
bio: |
  The practice works across architecture, interiors and bespoke furniture, and is born in Greece. Each project starts from the place and the material, and is developed through drawing, models and full-scale prototypes.

  Furniture is designed and made in close collaboration with local workshops. Building sites are supervised closely at every stage, so that the design intent carries through to the last detail.
disciplines:
  - Architecture
  - Interior design
  - Bespoke furniture
  - Site supervision
